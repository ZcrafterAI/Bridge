# Publishes a version: push a tag like v0.3.0 and this
#   1. runs the tests and builds the package,
#   2. publishes it to PyPI (so `uvx zcrafter-bridge` works),
#   3. publishes server.json to the official MCP Registry.
#
# One-time setup, by an owner of the PyPI project and the GitHub organisation:
#   - On pypi.org, add a "trusted publisher" for the project zcrafter-bridge:
#     owner ZcrafterAI, repository Bridge, workflow release.yml, environment pypi.
#     No token is stored anywhere.
#   - The MCP Registry step signs in with GitHub's own identity for this repository,
#     which may publish names under io.github.ZcrafterAI/. It needs no secret either.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag, the package and server.json name the same version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          package="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          listed="$(python -c 'import json; d = json.load(open("server.json")); print(d["version"], d["packages"][0]["version"])')"
          echo "tag=$tag package=$package server.json=$listed"
          test "$tag" = "$package"
          test "$listed" = "$package $package"
      - name: Test
        run: |
          pip install -e ".[dev]"
          pytest -q
      - name: Build
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing: no stored token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write # signs in to the MCP Registry as this repository
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v5
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Sign in to the MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish
